# Publishes the package to npm when a `vX.Y.Z` tag is pushed. No token: npm
# trusted publishing (OIDC) vouches for this workflow, and npm adds the
# provenance statement itself. One-time setup and the release steps:
# RELEASING.md.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: write # the GitHub Release after the publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21" # the sizes in sizes.json depend on the Bun version

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 may bundle older.
      - name: Ensure npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag version $tag_version differs from package.json version $package_version"
            exit 1
          fi

      - name: Build
        run: bun run build

      # Every entry must load in Node before it goes out (0.1.0 did not).
      - name: Load the built entries
        run: bun run check:dist

      - name: Publish
        run: npm publish

      # The release notes are this version's section of CHANGELOG.md, from its
      # heading (`## X.Y.Z (date)`) up to the next one.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const version = process.env.TAG.slice(1);
            const lines = require("fs").readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((line) => line.startsWith(`## ${version} `));
            if (start === -1) throw new Error(`No CHANGELOG section for ${version}`);
            const end = lines.findIndex((line, i) => i > start && line.startsWith("## "));
            const notes = lines.slice(start + 1, end === -1 ? undefined : end).join("\n").trim();
            require("fs").writeFileSync("release-notes.md", notes + "\n");
          '
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
